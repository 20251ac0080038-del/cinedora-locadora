<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineDora — Locadora de Filmes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --butter: #fff8c9;
      --butter-escuro: #ffeaa7;
      --rosa: #ffb6d9;
      --rosa-escuro: #ff6fb5;
      --rosa-claro: #ffe0ef;
      --texto: #7a2e57;
      --texto-claro: #b85488;
      --branco: #fffdf5;
      --borda: #ff8cc6;
      --sombra: 4px 4px 0px var(--rosa-escuro);
      --radius: 4px;
    }

    body {
      font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
      background: var(--butter);
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 182, 217, 0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 182, 217, 0.25), transparent 40%);
      color: var(--texto);
      line-height: 1.6;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    h1, h2, h3, .logo, .poster-card p {
      font-family: 'Pacifico', 'Brush Script MT', cursive;
      font-weight: 400;
    }

    
    .btn {
      border: 2px solid var(--rosa-escuro);
      border-radius: var(--radius);
      padding: 10px 20px;
      font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-block;
      background: var(--rosa);
      color: var(--texto);
      box-shadow: var(--sombra);
    }
    .btn:hover {
      background: var(--rosa-escuro);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--rosa-escuro);
    }
    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }
    .btn:disabled {
      background: #e5e5e5;
      border-color: #b0b0b0;
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-lg {
      padding: 14px 30px;
      font-size: 1.1rem;
    }

    .btn-block {
      width: 100%;
      margin-top: auto;
    }


    .header {
      background: var(--rosa-claro);
      border-bottom: 3px double var(--rosa-escuro);
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 0 var(--butter-escuro);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    .logo {
      font-size: 2rem;
      color: var(--rosa-escuro);
      text-decoration: none;
      text-shadow: 2px 2px 0 var(--butter-escuro);
    }
    .logo span {
      color: var(--rosa-escuro);
    }

    .nav {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--texto);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 4px 10px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .nav a:hover {
      background: var(--butter-escuro);
    }

   
    .hero {
      background: linear-gradient(135deg, var(--rosa-claro), var(--butter));
      padding: 60px 0;
      border-bottom: 3px dotted var(--rosa-escuro);
    }

    .hero-text h1 {
      font-size: 3rem;
      margin-bottom: 16px;
      color: var(--rosa-escuro);
      text-shadow: 3px 3px 0 var(--butter-escuro);
      line-height: 1.3;
    }
    .hero-text h1 span {
      color: var(--texto);
    }

    .hero-text p {
      color: var(--texto-claro);
      font-size: 1.2rem;
      margin: 0 auto 28px;
      max-width: 600px;
    }

    
    .section {
      padding: 50px 0;
    }

    .section h2 {
      font-size: 2.2rem;
      color: var(--rosa-escuro);
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 var(--butter-escuro);
    }

    .section-sub {
      color: var(--texto-claro);
      margin-bottom: 32px;
      font-size: 1.05rem;
    }

    
    .grid-filmes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .card-filme {
      background: var(--branco);
      border: 3px solid var(--borda);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s ease;
      display: flex;
      flex-direction: column;
      box-shadow: var(--sombra);
      text-align: center;
    }
    .card-filme:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--rosa-escuro);
    }

    .capa {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      border-bottom: 2px dashed var(--borda);
      position: relative;
      overflow: hidden;
      background:
        repeating-linear-gradient(45deg,
          var(--butter-escuro),
          var(--butter-escuro) 10px,
          var(--rosa-claro) 10px,
          var(--rosa-claro) 20px);
    }

    .capa img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .capa-aviso {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--rosa-escuro);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px;
      border-radius: 3px;
      border: 1px dashed var(--rosa-escuro);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-body h3 {
      font-size: 1.15rem;
      margin-bottom: 4px;
      color: var(--rosa-escuro);
      line-height: 1.3;
    }

    .ano {
      font-size: 0.85rem;
      color: var(--texto-claro);
      margin-bottom: 10px;
    }

    .avaliacao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stars {
      color: #ffb400;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .nota {
      font-weight: 700;
      color: var(--texto);
      font-size: 0.9rem;
    }

    .estoque-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 3px;
      margin: 0 auto 12px;
      background: var(--butter-escuro);
      color: var(--texto);
      border: 2px solid var(--borda);
      transition: background 0.2s, color 0.2s;
    }
    .estoque-badge.baixo {
      background: #ffe0b2;
      color: #b25d00;
    }
    .estoque-badge.esgotado {
      background: #ffc1c1;
      color: #a51818;
    }

    
    .footer {
      background: var(--rosa-claro);
      border-top: 3px double var(--rosa-escuro);
      padding: 26px 0;
      margin-top: 30px;
      text-align: center;
    }

    .footer-inner {
      color: var(--texto);
      font-size: 1rem;
    }
    .footer-inner p {
      margin-bottom: 4px;
    }

    
    @media (max-width: 700px) {
      .hero-text h1 {
        font-size: 2rem;
      }
      .nav {
        gap: 14px;
      }
    }
  </style>
</head>
<body>


  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo">Cine<span>Dora</span></a>
      <nav class="nav">
        <a href="#filmes">Filmes</a>
      </nav>
    </div>
  </header>

  
  <section class="hero">
    <div class="container">
      <div class="hero-text">
        <h1>Alugue seus <span>filmes</span> favoritos ♡</h1>
        <p>Escolha um filme abaixo e clique em <strong>Alugar</strong>. A cada aluguel, o estoque diminui.</p>
        <button class="btn btn-lg" onclick="document.getElementById('filmes').scrollIntoView({behavior:'smooth'})">
          Ver filmes disponíveis 
        </button>
      </div>
    </div>
  </section>

  
  <section class="section" id="filmes">
    <div class="container">
      <h2>Filmes disponíveis ♥</h2>
      <p class="section-sub">Cada filme tem <strong>10 cópias</strong> em estoque. Clique em <strong>Alugar</strong>!</p>

      <div class="grid-filmes" id="lista-filmes">
        
      </div>
    </div>
  </section>

  
  <footer class="footer">
    <div class="container footer-inner">
      <p>CineDora— Locadora de Filmes</p>
    </div>
  </footer>

  
  <script>
    
    class Produto {
      constructor(nomeProduto, preco) {
        this.nome = nomeProduto;
        this.preco = preco;
        this.estoque = 10;
      }

      vender() {
        if (this.estoque > 0) {
          this.estoque = this.estoque - 1;
          return { ok: true, restam: this.estoque };
        } else {
          return { ok: false, restam: 0 };
        }
      }
    }

    
    const filmes = [
      new Produto("Jogos Vorazes", 10),
      new Produto("Guardiões da Galáxia", 13),
      new Produto("Como Perder um Homem em 10 Dias", 7),
      new Produto("Mamma Mia!", 9),
      new Produto("Peter Pan", 8),
      new Produto("Diário de uma Paixão", 10)
    ];

    
    const visuais = [
  { emoji: "🏹", foto: "imagespeeta.jpeg", ano: "2012 • Aventura", nota: "4.4", estrelas: "★★★★☆" },
  { emoji: "🌌", foto: "gotg.jpeg", ano: "2014 • Ação",     nota: "4.7", estrelas: "★★★★★" },
  { emoji: "💌", foto: "homem.jpeg", ano: "2003 • Comédia",  nota: "4.0", estrelas: "★★★★☆" },
  { emoji: "🎶", foto: "mamaia.jpeg", ano: "2008 • Musical",  nota: "4.5", estrelas: "★★★★☆" },
  { emoji: "🧚", foto: "peter.jpeg", ano: "2003 • Fantasia", nota: "4.2", estrelas: "★★★★☆" },
  { emoji: "💧", foto: "diario.jpeg", ano: "2004 • Romance",  nota: "4.8", estrelas: "★★★★★" }
];
    
    const container = document.getElementById("lista-filmes");

    function renderizarFilmes() {
      container.innerHTML = "";

      filmes.forEach((filme, i) => {
        const v = visuais[i];

        let classeEstoque = "estoque-badge";
        if (filme.estoque === 0) classeEstoque += " esgotado";
        else if (filme.estoque <= 3) classeEstoque += " baixo";

        const textoBotao = filme.estoque > 0
          ? `Alugar — R$ ${filme.preco}`
          : "Esgotado";

       
        const capaHTML = v.foto
          ? `<img src="${v.foto}" alt="Foto do filme ${filme.nome}">`
          : `${v.emoji}<div class="capa-aviso"></div>`;

        const card = document.createElement("article");
        card.className = "card-filme";
        card.innerHTML = `
          <div class="capa">
            ${capaHTML}
          </div>
          <div class="card-body">
            <h3>${filme.nome}</h3>
            <p class="ano">${v.ano}</p>
            <div class="avaliacao">
              <span class="stars">${v.estrelas}</span>
              <span class="nota">${v.nota}</span>
            </div>
            <span class="${classeEstoque}">Estoque: ${filme.estoque}</span>
            <button
              class="btn btn-block"
              ${filme.estoque === 0 ? "disabled" : ""}
              onclick="alugar(${i})">
              ${textoBotao}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    
    function alugar(indice) {
      const filme = filmes[indice];
      const resultado = filme.vender();

      if (resultado.ok) {
        alert("🎬 Você alugou: " + filme.nome + "\nRestam: " + resultado.restam + " cópias ♡");
      } else {
        alert("❌ O filme " + filme.nome + " acabou no estoque!");
      }

      renderizarFilmes();
    }

    renderizarFilmes();
  </script>

</body>
</html>
